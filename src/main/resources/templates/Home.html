<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hot Resetter</title>
    <style>
        :root {
            --bg: #0b1020;
            --surface: #151b2e;
            --surface-2: #1c2440;
            --border: rgba(148, 163, 184, 0.16);
            --text: #e8edf7;
            --muted: #93a0b8;
            --accent: #f5a524;
            --accent-strong: #ffb949;
            --accent-ink: #241703;
            --cyan: #3dd6d0;
            --radius: 20px;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: clamp(24px, 6vw, 64px) clamp(16px, 4vw, 32px);
            font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 15% -10%, rgba(61, 214, 208, 0.16), transparent 60%),
                radial-gradient(800px 600px at 90% 0%, rgba(245, 165, 36, 0.14), transparent 55%),
                var(--bg);
        }

        .shell {
            width: 100%;
            max-width: 620px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(145deg, var(--accent), #d97706);
            color: var(--accent-ink);
            box-shadow: 0 10px 24px rgba(245, 165, 36, 0.32);
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.4rem, 4vw, 1.75rem);
            letter-spacing: -0.02em;
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .card {
            background: linear-gradient(180deg, rgba(28, 36, 64, 0.92), rgba(21, 27, 46, 0.96));
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: clamp(22px, 5vw, 36px);
        }

        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 12px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h2.section-label {
            font-size: 1.05rem;
            letter-spacing: -0.01em;
            text-transform: none;
            color: var(--text);
            margin-bottom: 18px;
        }

        .players {
            list-style: none;
            margin: 0 0 14px;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        .players li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .player-index {
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            margin-top: 22px;
            border-radius: 10px;
            background: rgba(61, 214, 208, 0.12);
            border: 1px solid rgba(61, 214, 208, 0.24);
            color: var(--cyan);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .field {
            flex: 1;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(8, 12, 24, 0.72);
            color: var(--text);
            font: inherit;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        input::placeholder {
            color: #5f6c85;
        }

        input:focus {
            outline: none;
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(61, 214, 208, 0.18);
            background: rgba(8, 12, 24, 0.95);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid transparent;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.18s ease, border-color 0.18s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .btn-ghost {
            width: 100%;
            color: var(--muted);
            background: transparent;
            border: 1px dashed rgba(148, 163, 184, 0.32);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: var(--cyan);
            background: rgba(61, 214, 208, 0.06);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 26px 0;
            border: 0;
        }

        .time-row {
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .time-row .field {
            flex: 0 1 190px;
        }

        .input-suffix {
            position: relative;
        }

        .input-suffix input {
            padding-right: 84px;
        }

        .input-suffix span {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            pointer-events: none;
        }

        .help {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .btn-primary {
            width: 100%;
            margin-top: 18px;
            padding: 15px 20px;
            font-size: 1.02rem;
            color: var(--accent-ink);
            background: linear-gradient(180deg, var(--accent-strong), var(--accent));
            box-shadow: 0 12px 28px rgba(245, 165, 36, 0.28);
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #ffc766, var(--accent-strong));
        }

        .footnote {
            margin: 18px 0 0;
            text-align: center;
            color: #6f7c94;
            font-size: 0.78rem;
        }

        @media (max-width: 520px) {
            .time-row {
                flex-direction: column;
                align-items: stretch;
            }

            .time-row .field {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="13" r="8"></circle>
                    <path d="M12 9v4l2.5 2"></path>
                    <path d="M9 2h6"></path>
                </svg>
            </div>
            <div>
                <h1>Timer Hot Resetter</h1>
                <p>Fair turns, one click at a time.</p>
            </div>
        </header>

        <section class="card" aria-labelledby="setup-title">
            <h2 id="setup-title" class="section-label">Set up your game</h2>

            <form th:action="@{test}" method="post">
                <p class="section-label" aria-hidden="true">Players</p>

                <ul id="players_list" class="players">
                    <li>
                        <span class="player-index" aria-hidden="true">1</span>
                        <div class="field">
                            <label for="name_1">Player 1 name</label>
                            <input id="name_1" type="text" name="name" placeholder="e.g. Alex" autocomplete="off">
                        </div>
                    </li>
                </ul>

                <button id="add_user" type="button" class="btn btn-ghost">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    Add player
                </button>

                <hr class="divider">

                <div class="time-row">
                    <div class="field">
                        <label for="timeInSec">Round time</label>
                        <div class="input-suffix">
                            <input id="timeInSec" type="number" name="timeInSec" min="1" placeholder="60" required>
                            <span>seconds</span>
                        </div>
                    </div>
                </div>
                <p class="help">Each player gets this much time per turn.</p>

                <button type="submit" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.74l-11-6.86A1 1 0 0 0 8 5.14Z"></path>
                    </svg>
                    Start game
                </button>
            </form>
        </section>

        <p class="footnote">No more three-minute turns.</p>
    </div>

    <li hidden id="template_player_list_item">
        <span class="player-index" aria-hidden="true"></span>
        <div class="field">
            <label for="name_0">Player name</label>
            <input id="name_0" type="text" name="name" placeholder="e.g. Jamie" autocomplete="off">
        </div>
    </li>

    <script>
        const btn = document.querySelector("#add_user");
        const players_list = document.querySelector("#players_list");
        const template_player_list_item = document.querySelector("#template_player_list_item");

        btn.addEventListener("click", () => {
            const list_items = players_list.querySelectorAll("li");

            // The below syntax allows us to cast a type. (fake casting for the language server)
            const new_player = /** @type {HTMLElement} */ (template_player_list_item.cloneNode(true));

            const input = new_player.querySelector("input");
            const label = new_player.querySelector("label");
            const badge = new_player.querySelector(".player-index");

            const index = list_items.length + 1;
            const name = `name_${index}`;

            input.setAttribute("id", name);
            label.setAttribute("for", name);
            label.textContent = `Player ${index} name`;
            badge.textContent = String(index);

            new_player.removeAttribute("hidden");
            new_player.removeAttribute("id");
            players_list.appendChild(new_player);
            input.focus();
        });
    </script>
</body>

</html>
