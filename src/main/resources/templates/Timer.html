<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hot Resetter - Game</title>
    <style>
        :root {
            --bg: #0b1020;
            --surface: #151b2e;
            --surface-2: #1c2440;
            --border: rgba(148, 163, 184, 0.16);
            --text: #e8edf7;
            --muted: #93a0b8;
            --accent: #f5a524;
            --accent-strong: #ffb949;
            --accent-ink: #241703;
            --cyan: #3dd6d0;
            --danger: #f87171;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 20% -10%, rgba(61, 214, 208, 0.14), transparent 60%),
                radial-gradient(900px 700px at 100% 10%, rgba(245, 165, 36, 0.12), transparent 55%),
                var(--bg);
        }

        .stage {
            width: 100%;
            max-width: 860px;
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 32px);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(18px, 4vw, 30px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(145deg, var(--accent), #d97706);
            color: var(--accent-ink);
            box-shadow: 0 8px 18px rgba(245, 165, 36, 0.28);
        }

        .round-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(61, 214, 208, 0.28);
            background: rgba(61, 214, 208, 0.08);
            color: var(--cyan);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .round-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .timer-card {
            --progress: 1;
            position: relative;
            overflow: hidden;
            padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px);
            border: 1px solid var(--border);
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(28, 36, 64, 0.94), rgba(15, 20, 36, 0.98));
            box-shadow: var(--shadow);
            text-align: center;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .timer-card::before {
            content: "";
            position: absolute;
            inset: -40% 10% auto;
            height: 320px;
            background: radial-gradient(closest-side, rgba(61, 214, 208, 0.14), transparent);
            pointer-events: none;
        }

        .eyebrow {
            position: relative;
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .player-name {
            position: relative;
            margin: 0;
            font-size: clamp(1.9rem, 5.5vw, 3.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            overflow-wrap: anywhere;
        }

        .clock {
            position: relative;
            margin: clamp(16px, 3vw, 26px) 0 0;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            color: var(--text);
            transition: color 0.3s ease;
        }

        .clock time {
            font-size: clamp(4.5rem, 20vw, 10.5rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.05em;
            font-variant-numeric: tabular-nums;
        }

        .clock .unit {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: var(--muted);
        }

        .timer-card.is-low {
            border-color: rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.15), var(--shadow);
        }

        .timer-card.is-low .clock {
            color: var(--danger);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.025);
            }
        }

        .progress {
            position: relative;
            height: 10px;
            margin-top: clamp(20px, 4vw, 32px);
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.14);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            transform: scaleX(var(--progress, 1));
            transform-origin: left center;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--cyan), var(--accent));
            transition: transform 0.35s linear, background 0.3s ease;
        }

        .timer-card.is-low .progress-fill {
            background: linear-gradient(90deg, #fb923c, var(--danger));
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: clamp(20px, 4vw, 28px);
        }

        .btn-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .btn-toggle:hover {
            border-color: var(--accent);
            background: #232d4f;
        }

        .btn-toggle:active {
            transform: translateY(1px);
        }

        .btn-toggle:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .btn-toggle[data-active="false"] {
            border-color: rgba(245, 165, 36, 0.5);
            color: var(--accent-strong);
        }

        .btn-toggle .icon-play {
            display: none;
        }

        .btn-toggle[data-active="false"] .icon-pause {
            display: none;
        }

        .btn-toggle[data-active="false"] .icon-play {
            display: block;
        }

        .roster {
            list-style: none;
            margin: clamp(22px, 4vw, 30px) 0 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .roster li {
            max-width: 180px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(21, 27, 46, 0.7);
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .roster li.active {
            border-color: transparent;
            background: linear-gradient(180deg, var(--accent-strong), var(--accent));
            color: var(--accent-ink);
            box-shadow: 0 8px 20px rgba(245, 165, 36, 0.24);
        }

        @media (max-width: 520px) {
            .round-badge {
                display: none;
            }

            .clock time {
                font-size: clamp(4rem, 26vw, 7rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 9v4l2.5 2"></path>
                        <path d="M9 2h6"></path>
                    </svg>
                </span>
                <span>Timer Hot Resetter</span>
            </div>
            <span class="round-badge">Game in progress</span>
        </header>

        <section id="timer-card" class="timer-card" aria-labelledby="current_user">
            <p class="eyebrow">Now playing</p>
            <h1 id="current_user" class="player-name" aria-live="polite"></h1>

            <div class="clock">
                <time id="timer" th:text="${timeInSec}" role="timer" aria-live="off"></time>
                <span class="unit">s</span>
            </div>

            <div class="progress" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="100">
                <div class="progress-fill"></div>
            </div>
        </section>

        <div class="controls">
            <button id="toggle" class="btn-toggle" type="button" data-active="true" aria-pressed="true"
                aria-label="Pause timer" onclick="toggleTimer()">
                <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
                <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.74l-11-6.86A1 1 0 0 0 8 5.14Z"></path>
                </svg>
                <span id="toggle-label">Pause timer</span>
            </button>
        </div>

        <ul id="roster" class="roster" aria-label="Players"></ul>

        <ul hidden id="users">
            <li th:each="name : ${names}" th:text="${name}"></li>
        </ul>
    </main>

    <script>
        const namesUl = document.querySelector("ul#users");
        const timerInSecDiv = /** @type {HTMLElement} */ (document.querySelector("time#timer"));
        const timerCard = document.querySelector("#timer-card");
        const progressBar = document.querySelector(".progress");
        const currentUserDiv = document.querySelector("#current_user");
        const toggleButton = document.querySelector("#toggle");
        const toggleLabel = document.querySelector("#toggle-label");
        const roster = document.querySelector("#roster");

        const duration = parseInt(timerInSecDiv.innerText, 10) || 60;
        let currentTimer = duration;
        let isTimerActive = true;
        let interval;
        let currentIndex = 0;

        const namesLi = namesUl.querySelectorAll("li");
        const userNames = [...namesLi].map((el, i) => el.innerText.trim() || `Player ${i + 1}`);

        if (userNames.length === 0) {
            userNames.push("Player 1");
        }

        const rosterItems = userNames.map((name) => {
            const item = document.createElement("li");
            item.textContent = name;
            roster.appendChild(item);
            return item;
        });

        function setCurrentUser(index) {
            currentIndex = ((index % userNames.length) + userNames.length) % userNames.length;
            currentUserDiv.textContent = userNames[currentIndex];
            rosterItems.forEach((item, i) => item.classList.toggle("active", i === currentIndex));
        }

        function renderTimer() {
            timerInSecDiv.textContent = String(Math.max(currentTimer, 0));

            const ratio = duration > 0 ? Math.max(0, Math.min(1, currentTimer / duration)) : 0;
            timerCard.style.setProperty("--progress", String(ratio));

            progressBar.setAttribute("aria-valuemax", String(duration));
            progressBar.setAttribute("aria-valuenow", String(Math.max(currentTimer, 0)));

            timerCard.classList.toggle("is-low", currentTimer <= 10);
        }

        function startTimer() {
            clearInterval(interval);

            interval = setInterval(() => {
                currentTimer--;

                if (currentTimer <= 0) {
                    nextUser();
                    currentTimer = duration;
                }

                renderTimer();
            }, 1000);
        }

        function syncToggle() {
            toggleButton.dataset.active = String(isTimerActive);
            toggleButton.setAttribute("aria-pressed", String(isTimerActive));
            toggleButton.setAttribute("aria-label", isTimerActive ? "Pause timer" : "Resume timer");
            toggleLabel.textContent = isTimerActive ? "Pause timer" : "Resume timer";
        }

        function toggleTimer() {
            isTimerActive = !isTimerActive;

            if (isTimerActive) {
                startTimer();
            } else {
                clearInterval(interval);
            }

            syncToggle();
        }

        function nextUser() {
            setCurrentUser(currentIndex + 1);
        }

        setCurrentUser(0);
        renderTimer();
        syncToggle();
        startTimer();
    </script>
</body>

</html>
