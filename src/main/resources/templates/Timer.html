<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Hot Resetter - Game</title>
    <style>
        :root {
            --bg: #0b1020;
            --surface: #151b2e;
            --surface-2: #1c2440;
            --border: rgba(148, 163, 184, 0.16);
            --text: #e8edf7;
            --muted: #93a0b8;
            --accent: #f5a524;
            --accent-strong: #ffb949;
            --accent-ink: #241703;
            --cyan: #3dd6d0;
            --danger: #f87171;
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 20% -10%, rgba(61, 214, 208, 0.14), transparent 60%),
                radial-gradient(900px 700px at 100% 10%, rgba(245, 165, 36, 0.12), transparent 55%),
                var(--bg);
        }

        .stage {
            width: 100%;
            max-width: 860px;
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(20px, 5vw, 40px) clamp(16px, 4vw, 32px);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(18px, 4vw, 30px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(145deg, var(--accent), #d97706);
            color: var(--accent-ink);
            box-shadow: 0 8px 18px rgba(245, 165, 36, 0.28);
        }

        .round-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(61, 214, 208, 0.28);
            background: rgba(61, 214, 208, 0.08);
            color: var(--cyan);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .round-badge::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sound-toggle {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--muted);
            cursor: pointer;
            transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .sound-toggle:hover {
            color: var(--text);
            border-color: var(--accent);
            background: #232d4f;
        }

        .sound-toggle:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .sound-toggle .icon-sound-off {
            display: none;
        }

        .sound-toggle[data-on="false"] {
            color: #5f6c85;
        }

        .sound-toggle[data-on="false"] .icon-sound-on {
            display: none;
        }

        .sound-toggle[data-on="false"] .icon-sound-off {
            display: block;
        }

        .timer-card {
            --player-color: var(--cyan);
            --ring-opacity: 1;
            position: relative;
            overflow: hidden;
            padding: clamp(24px, 5vw, 48px) clamp(20px, 5vw, 48px);
            border: 1px solid color-mix(in srgb, var(--player-color) 52%, var(--border));
            border-radius: 28px;
            background-color: color-mix(in srgb, var(--player-color) 42%, #0d1324);
            background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.18));
            box-shadow: var(--shadow), 0 0 65px color-mix(in srgb, var(--player-color) 26%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--player-color) 45%, transparent);
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.55s ease, border-color 0.45s ease,
                box-shadow 0.45s ease, transform 0.15s ease;
        }

        .timer-card:active {
            transform: scale(0.994);
        }

        .timer-card:focus-visible {
            outline: 2px solid var(--player-color);
            outline-offset: 4px;
        }

        .timer-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--flash-x, 50%) var(--flash-y, 50%),
                    color-mix(in srgb, var(--player-color) 34%, transparent), transparent 45%);
            opacity: 0;
            pointer-events: none;
        }

        .timer-card.is-skipping::after {
            animation: card-flash 0.5s ease-out;
        }

        @keyframes card-flash {
            0% {
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .timer-card::before {
            content: "";
            position: absolute;
            top: -45%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: var(--player-color);
            filter: blur(80px);
            opacity: 0.26;
            pointer-events: none;
            transition: background-color 0.5s ease, opacity 0.5s ease;
        }

        .eyebrow {
            position: relative;
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .player-name {
            position: relative;
            margin: 0;
            font-size: clamp(1.9rem, 5.5vw, 3.25rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.1;
            overflow-wrap: anywhere;
            color: var(--player-color);
            text-shadow: 0 0 34px color-mix(in srgb, var(--player-color) 24%, transparent);
            transition: color 0.35s ease;
            will-change: transform, opacity, filter;
        }

        .clock-wrap {
            position: relative;
            width: min(340px, 76vw);
            aspect-ratio: 1;
            margin: clamp(12px, 3vw, 22px) auto 0;
            display: grid;
            place-items: center;
        }

        .clock-ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .clock-track {
            fill: none;
            stroke: color-mix(in srgb, var(--player-color) 18%, rgba(148, 163, 184, 0.16));
            stroke-width: 8;
            transition: stroke 0.55s ease;
        }

        .clock-progress {
            fill: none;
            stroke: var(--player-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
            opacity: var(--ring-opacity, 1);
            filter: drop-shadow(0 0 7px color-mix(in srgb, var(--player-color) 60%, transparent));
            transition: stroke 0.55s ease, opacity 0.35s linear, stroke-dashoffset 0.35s linear,
                filter 0.55s ease;
        }

        .clock-ticks line {
            stroke: color-mix(in srgb, var(--player-color) 40%, rgba(148, 163, 184, 0.35));
            stroke-width: 2;
            stroke-linecap: round;
            transition: stroke 0.55s ease;
        }

        .clock {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            color: var(--text);
            transition: color 0.3s ease;
        }

        .clock time {
            font-size: clamp(3.4rem, 16vw, 6.75rem);
            font-weight: 800;
            line-height: 0.9;
            letter-spacing: -0.05em;
            font-variant-numeric: tabular-nums;
        }

        .clock .unit {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 600;
            color: var(--muted);
        }

        .timer-card.is-low {
            border-color: rgba(248, 113, 113, 0.4);
            box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.15), var(--shadow);
        }

        .timer-card.is-low::before {
            background-color: var(--danger);
            opacity: 0.16;
        }

        .timer-card.is-low .clock {
            color: var(--danger);
            animation: pulse 1s ease-in-out infinite;
        }

        .timer-card.is-low .clock-progress {
            stroke: var(--danger);
            opacity: 1;
            filter: drop-shadow(0 0 8px rgba(248, 113, 113, 0.6));
        }

        .timer-card.is-low .clock-ticks line {
            stroke: rgba(248, 113, 113, 0.55);
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.025);
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle,
                    color-mix(in srgb, var(--player-color) 38%, transparent),
                    color-mix(in srgb, var(--player-color) 14%, transparent) 52%,
                    transparent 70%);
            opacity: 0.9;
            transform: scale(0);
            pointer-events: none;
            animation: ripple 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes ripple {
            to {
                transform: scale(1);
                opacity: 0;
            }
        }

        .skip-hint {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: clamp(16px, 3vw, 24px) 0 0;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .skip-hint::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--player-color);
            box-shadow: 0 0 8px color-mix(in srgb, var(--player-color) 60%, transparent);
            transition: background-color 0.35s ease, box-shadow 0.35s ease;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: clamp(20px, 4vw, 28px);
        }

        .btn-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .btn-toggle:hover {
            border-color: var(--accent);
            background: #232d4f;
        }

        .btn-toggle:active {
            transform: translateY(1px);
        }

        .btn-toggle:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        .btn-toggle[data-active="false"] {
            border-color: rgba(245, 165, 36, 0.5);
            color: var(--accent-strong);
        }

        .btn-toggle .icon-play {
            display: none;
        }

        .btn-toggle[data-active="false"] .icon-pause {
            display: none;
        }

        .btn-toggle[data-active="false"] .icon-play {
            display: block;
        }

        .roster {
            list-style: none;
            margin: clamp(22px, 4vw, 30px) 0 0;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .roster li {
            --player-color: var(--cyan);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            max-width: 180px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid color-mix(in srgb, var(--player-color) 34%, var(--border));
            background: rgba(21, 27, 46, 0.7);
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .roster li::before {
            content: "";
            flex: 0 0 auto;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--player-color);
            box-shadow: 0 0 8px color-mix(in srgb, var(--player-color) 60%, transparent);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .roster li.active {
            border-color: transparent;
            background: var(--player-color);
            color: #0b1020;
            box-shadow: 0 8px 20px color-mix(in srgb, var(--player-color) 28%, transparent);
        }

        .roster li.active::before {
            background-color: #0b1020;
            box-shadow: none;
        }

        @media (max-width: 520px) {
            .round-badge {
                display: none;
            }

            .clock-wrap {
                width: min(300px, 84vw);
            }

            .clock time {
                font-size: clamp(3rem, 18vw, 5.5rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="stage">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="13" r="8"></circle>
                        <path d="M12 9v4l2.5 2"></path>
                        <path d="M9 2h6"></path>
                    </svg>
                </span>
                <span>Timer Hot Resetter</span>
            </div>
            <div class="topbar-actions">
                <span class="round-badge">Game in progress</span>
                <button id="sound" class="sound-toggle" type="button" data-on="true" aria-pressed="true"
                    aria-label="Mute sounds">
                    <svg class="icon-sound-on" width="17" height="17" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4z"></path>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                        <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                    </svg>
                    <svg class="icon-sound-off" width="17" height="17" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4z"></path>
                        <path d="m16 9 5 6"></path>
                        <path d="m21 9-5 6"></path>
                    </svg>
                </button>
            </div>
        </header>

        <section id="timer-card" class="timer-card" role="button" tabindex="0" aria-label="Skip to the next player">
            <p class="eyebrow">Now playing</p>
            <h1 id="current_user" class="player-name" aria-live="polite"></h1>

            <div class="clock-wrap">
                <svg class="clock-ring" viewBox="0 0 220 220" aria-hidden="true">
                    <circle class="clock-track" cx="110" cy="110" r="92"></circle>
                    <circle class="clock-progress" cx="110" cy="110" r="92" pathLength="100"
                        transform="rotate(-90 110 110)"></circle>
                    <g class="clock-ticks">
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(0 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(30 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(60 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(90 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(120 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(150 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(180 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(210 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(240 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(270 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(300 110 110)"></line>
                        <line x1="110" y1="4" x2="110" y2="12" transform="rotate(330 110 110)"></line>
                    </g>
                </svg>

                <div class="clock">
                    <time id="timer" th:text="${timeInSec}" role="timer" aria-live="off"></time>
                    <span class="unit">s</span>
                </div>
            </div>

            <p class="skip-hint">Click or press Enter to skip</p>
        </section>

        <div class="controls">
            <button id="toggle" class="btn-toggle" type="button" data-active="true" aria-pressed="true"
                aria-label="Pause timer" onclick="toggleTimer()">
                <svg class="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                </svg>
                <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M8 5.14v13.72a1 1 0 0 0 1.5.87l11-6.86a1 1 0 0 0 0-1.74l-11-6.86A1 1 0 0 0 8 5.14Z"></path>
                </svg>
                <span id="toggle-label">Pause timer</span>
            </button>
        </div>

        <ul id="roster" class="roster" aria-label="Players"></ul>

        <ul hidden id="users">
            <li th:each="name : ${names}" th:text="${name}"></li>
        </ul>
    </main>

    <script>
        const namesUl = document.querySelector("ul#users");
        const timerInSecDiv = /** @type {HTMLElement} */ (document.querySelector("time#timer"));
        const timerCard = document.querySelector("#timer-card");
        const clockProgress = /** @type {SVGCircleElement} */ (document.querySelector(".clock-progress"));
        const currentUserDiv = document.querySelector("#current_user");
        const toggleButton = document.querySelector("#toggle");
        const toggleLabel = document.querySelector("#toggle-label");
        const roster = document.querySelector("#roster");
        const soundButton = document.querySelector("#sound");
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        const duration = parseInt(timerInSecDiv.innerText, 10) || 60;
        let currentTimer = duration;
        let isTimerActive = true;
        let interval;
        let tickTimer;
        let currentIndex = 0;
        let swapId = 0;
        let soundOn = true;
        let audioCtx;
        let audioUnlocked = false;
        let masterGain;
        let activeCue = null;

        const TICK_VOLUME = 0.36;
        const CUE_VOLUME = 0.5;
        const MASTER_VOLUME = 1.4;

        const PLAYER_COLORS = [
            "#3dd6d0",
            "#f5a524",
            "#a78bfa",
            "#f472b6",
            "#60a5fa",
            "#4ade80",
            "#fb923c",
            "#a3e635"
        ];

        const namesLi = namesUl.querySelectorAll("li");
        const userNames = [...namesLi].map((el, i) => el.innerText.trim() || `Player ${i + 1}`);

        if (userNames.length === 0) {
            userNames.push("Player 1");
        }

        const playerColors = userNames.map((_, index) => PLAYER_COLORS[index % PLAYER_COLORS.length]);

        const rosterItems = userNames.map((name, index) => {
            const item = document.createElement("li");
            item.textContent = name;
            item.style.setProperty("--player-color", playerColors[index]);
            roster.appendChild(item);
            return item;
        });

        function setCurrentUser(index, playCue = false) {
            currentIndex = ((index % userNames.length) + userNames.length) % userNames.length;
            currentUserDiv.textContent = userNames[currentIndex];
            timerCard.style.setProperty("--player-color", playerColors[currentIndex]);
            rosterItems.forEach((item, i) => item.classList.toggle("active", i === currentIndex));

            if (playCue) {
                playNextUserCue();
            }
        }

        function renderTimer() {
            timerInSecDiv.textContent = String(Math.max(currentTimer, 0));

            const ratio = duration > 0 ? Math.max(0, Math.min(1, currentTimer / duration)) : 0;

            clockProgress.style.strokeDashoffset = String(100 - ratio * 100);
            timerCard.style.setProperty("--ring-opacity", String(0.35 + ratio * 0.65));

            timerCard.classList.toggle("is-low", currentTimer <= 10);
        }

        function ensureAudioGraph() {
            if (!audioCtx || masterGain) {
                return;
            }

            masterGain = audioCtx.createGain();
            masterGain.gain.value = MASTER_VOLUME;

            const compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -10;
            compressor.knee.value = 8;
            compressor.ratio.value = 4;
            compressor.attack.value = 0.003;
            compressor.release.value = 0.25;

            masterGain.connect(compressor);
            compressor.connect(audioCtx.destination);
        }

        function unlockAudio() {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;

            if (!AudioCtor) {
                return;
            }

            if (!audioCtx) {
                audioCtx = new AudioCtor();
            }

            ensureAudioGraph();

            const startTicking = () => {
                if (audioUnlocked) {
                    return;
                }

                audioUnlocked = true;

                if (isTimerActive && soundOn) {
                    scheduleTick();
                }
            };

            if (audioCtx.state === "running") {
                startTicking();
            } else {
                audioCtx.resume().then(startTicking).catch(() => {});
            }
        }

        function playTick() {
            if (!soundOn || !audioCtx || audioCtx.state !== "running" || !masterGain) {
                return;
            }

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(1150, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(TICK_VOLUME, now + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.075);
        }

        function stopActiveCue() {
            if (!activeCue || !audioCtx) {
                return;
            }

            const now = audioCtx.currentTime;
            const cue = activeCue;
            activeCue = null;

            const currentVolume = cue.gain.gain.value;
            cue.gain.gain.cancelScheduledValues(now);
            cue.gain.gain.setValueAtTime(Math.max(currentVolume, 0.0001), now);
            cue.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);

            cue.oscillators.forEach((osc) => {
                try {
                    osc.stop(now + 0.03);
                } catch (error) {}
            });
        }

        function playNextUserCue() {
            if (!soundOn || !audioCtx || audioCtx.state !== "running" || !masterGain) {
                return;
            }

            const now = audioCtx.currentTime;

            stopActiveCue();

            const cueGain = audioCtx.createGain();
            cueGain.gain.setValueAtTime(0.0001, now);
            cueGain.gain.exponentialRampToValueAtTime(CUE_VOLUME, now + 0.02);
            cueGain.gain.setValueAtTime(CUE_VOLUME, now + 0.28);
            cueGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            cueGain.connect(masterGain);

            const notes = [
                [659.25, 0, 0.18],
                [880, 0.12, 0.18],
                [1318.51, 0.24, 0.24]
            ];

            const oscillators = notes.map(([frequency, offset, duration]) => {
                const osc = audioCtx.createOscillator();

                osc.type = "triangle";
                osc.frequency.setValueAtTime(frequency, now + offset);
                osc.connect(cueGain);
                osc.start(now + offset);
                osc.stop(now + offset + duration);

                return osc;
            });

            activeCue = { gain: cueGain, oscillators };

            window.setTimeout(() => {
                if (activeCue && activeCue.gain === cueGain) {
                    activeCue = null;
                }
            }, 560);
        }

        function tickDelay(remaining) {
            const ratio = duration > 0 ? Math.max(0, Math.min(1, remaining / duration)) : 1;

            if (ratio >= 0.5) {
                return 1000;
            }

            const progress = (0.5 - ratio) / 0.5;
            return Math.round(1000 - progress * progress * 850);
        }

        function scheduleTick() {
            clearTimeout(tickTimer);

            if (!isTimerActive || !soundOn) {
                return;
            }

            playTick();
            tickTimer = setTimeout(scheduleTick, tickDelay(currentTimer));
        }

        function startTimer() {
            clearInterval(interval);

            interval = setInterval(() => {
                currentTimer--;

                if (currentTimer <= 0) {
                    nextUser();
                    currentTimer = duration;
                    clearTimeout(tickTimer);

                    if (soundOn) {
                        tickTimer = setTimeout(scheduleTick, tickDelay(currentTimer));
                    }
                }

                renderTimer();
            }, 1000);

            scheduleTick();
        }

        function syncToggle() {
            toggleButton.dataset.active = String(isTimerActive);
            toggleButton.setAttribute("aria-pressed", String(isTimerActive));
            toggleButton.setAttribute("aria-label", isTimerActive ? "Pause timer" : "Resume timer");
            toggleLabel.textContent = isTimerActive ? "Pause timer" : "Resume timer";
        }

        function toggleTimer() {
            isTimerActive = !isTimerActive;

            if (isTimerActive) {
                startTimer();
            } else {
                clearInterval(interval);
                clearTimeout(tickTimer);
            }

            syncToggle();
        }

        function syncSound() {
            soundButton.dataset.on = String(soundOn);
            soundButton.setAttribute("aria-pressed", String(soundOn));
            soundButton.setAttribute("aria-label", soundOn ? "Mute sounds" : "Unmute sounds");
        }

        soundButton.addEventListener("click", () => {
            soundOn = !soundOn;

            if (soundOn) {
                const wasUnlocked = audioUnlocked;
                unlockAudio();

                if (wasUnlocked) {
                    scheduleTick();
                }
            } else {
                clearTimeout(tickTimer);
                stopActiveCue();
            }

            syncSound();
        });

        document.addEventListener("pointerdown", unlockAudio, { passive: true });
        document.addEventListener("keydown", unlockAudio);

        function nextUser() {
            const nextIndex = (currentIndex + 1) % userNames.length;

            if (reduceMotion.matches) {
                setCurrentUser(nextIndex, true);
                return;
            }

            const id = ++swapId;
            currentUserDiv.getAnimations().forEach((animation) => animation.cancel());

            const outgoing = currentUserDiv.animate(
                [
                    { opacity: 1, transform: "translateY(0) scale(1)", filter: "blur(0)" },
                    { opacity: 0, transform: "translateY(-16px) scale(0.96)", filter: "blur(6px)" }
                ],
                { duration: 170, easing: "cubic-bezier(0.55, 0, 1, 0.45)", fill: "forwards" }
            );

            outgoing.onfinish = () => {
                if (id !== swapId) {
                    return;
                }

                setCurrentUser(nextIndex, true);

                currentUserDiv.animate(
                    [
                        { opacity: 0, transform: "translateY(18px) scale(0.96)", filter: "blur(6px)" },
                        { opacity: 1, transform: "translateY(0) scale(1)", filter: "blur(0)" }
                    ],
                    { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
                );
            };
        }

        function cardFeedback(clientX, clientY) {
            if (reduceMotion.matches) {
                return;
            }

            const rect = timerCard.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            timerCard.style.setProperty("--flash-x", `${(x / rect.width) * 100}%`);
            timerCard.style.setProperty("--flash-y", `${(y / rect.height) * 100}%`);

            const size = Math.max(rect.width, rect.height) * 2;
            const ripple = document.createElement("span");
            ripple.className = "ripple";
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            ripple.style.left = `${x - size / 2}px`;
            ripple.style.top = `${y - size / 2}px`;
            timerCard.appendChild(ripple);
            ripple.addEventListener("animationend", () => ripple.remove(), { once: true });

            timerCard.classList.remove("is-skipping");
            void timerCard.offsetWidth;
            timerCard.classList.add("is-skipping");
            window.setTimeout(() => timerCard.classList.remove("is-skipping"), 520);
        }

        function activateCard(clientX, clientY) {
            currentTimer = duration;
            renderTimer();

            if (isTimerActive && soundOn) {
                clearTimeout(tickTimer);
                tickTimer = setTimeout(scheduleTick, tickDelay(currentTimer));
            }

            nextUser();
            cardFeedback(clientX, clientY);
        }

        timerCard.addEventListener("click", (event) => {
            activateCard(event.clientX, event.clientY);
        });

        timerCard.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") {
                return;
            }

            event.preventDefault();

            const rect = timerCard.getBoundingClientRect();
            activateCard(rect.left + rect.width / 2, rect.top + rect.height / 2);
        });

        setCurrentUser(0);
        renderTimer();
        syncToggle();
        syncSound();
        startTimer();
    </script>
</body>

</html>
